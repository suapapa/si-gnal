# Copy to config.yaml and adjust. Paths are relative to the process working directory
# unless you use absolute paths.
# OpenAI settings are read from the environment (see .env.example in this directory), not from here.

server:
  listen: ":8080"

poem_queue:
  batch: 5
  use_memory: false

speaker:
  wirephone_effect: false
  add_noise: false

# OpenAI TTS voices to choose from at random (one per poem).
# Empty (or omitted) uses the default voice (coral).
# e.g. voices: [coral, nova, shimmer, alloy, echo, fable, onyx, ash, ballad, verse]
voices: []
