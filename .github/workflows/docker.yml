name: Docker images (linux/arm64)

# Builds cmd/server and cmd/player as linux/arm64 container images and
# pushes them to GHCR.
#
# No QEMU: the jobs run on GitHub's native ARM64 runners
# (ubuntu-24.04-arm), so the arm64 binaries — including the CGO/ALSA
# speaker code — are compiled and run natively. There is intentionally
# no docker/setup-qemu-action anywhere in this workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }} (linux/arm64)
    runs-on: ubuntu-24.04-arm # native ARM64 runner — no emulation
    concurrency:
      group: docker-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: Dockerfile.server
            image: si-gnal-server
          - name: player
            dockerfile: Dockerfile.player
            image: si-gnal-player
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check native arm64 runner
        run: |
          set -eu
          test "$(uname -m)" = "aarch64"
          uname -a

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          # PRs only verify the build (image is loaded locally, not pushed).
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify image is linux/arm64
        run: |
          set -eu
          tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            arch="$(docker image inspect "$tag" --format '{{.Os}}/{{.Architecture}}')"
            echo "built image platform: $arch"
            test "$arch" = "linux/arm64"
          else
            manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
            echo "$manifest"
            echo "$manifest" | grep -q '"architecture":"arm64"'
            echo "$manifest" | grep -q '"os":"linux"'
          fi
